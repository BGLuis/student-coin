spring:
  application:
    name: "Student Coin API"
  jpa:
    hibernate:
      ddl-auto: update
    database:
      driverClassName: org.postgresql.Driver

  mail:
    host: ${SMTP_HOST}
    port: ${SMTP_PORT}
    test-connection: true

jwt:
  key: ${JWT_KEY}
  algorithm: HmacSHA384
  issuer: student-coin
  expires-in: 24h