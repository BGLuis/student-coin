<!DOCTYPE html>
<html
	xmlns:th="http://www.thymeleaf.org"
	lang="pt-BR"
	th:fragment="layout"
>
	<head>
		<meta charset="UTF-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0"
		/>
		<title>Student Coin</title>
		<style>
			* {
				margin: 0;
				padding: 0;
				box-sizing: border-box;
			}

			body {
				font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI',
					Roboto, 'Helvetica Neue', Arial, sans-serif;
				line-height: 1.6;
				color: #333333;
				background-color: #f4f4f4;
				padding: 20px;
			}

			.email-container {
				max-width: 600px;
				margin: 0 auto;
				background-color: #ffffff;
				border-radius: 8px;
				overflow: hidden;
				box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
			}

			/* Header */
			.email-header {
				background: linear-gradient(135deg, #14b8a6 0%, #06b6d4 100%);
				color: #ffffff;
				padding: 30px 20px;
				text-align: center;
			}

			.email-header h1 {
				font-size: 28px;
				font-weight: 600;
				margin: 0;
				letter-spacing: -0.5px;
			}

			.logo {
				font-size: 36px;
				font-weight: 700;
				margin-bottom: 10px;
			}

			/* Content */
			.email-content {
				padding: 40px 30px;
			}

			.greeting {
				font-size: 18px;
				color: #1f2937;
				margin-bottom: 20px;
				font-weight: 500;
			}

			.content-body {
				font-size: 15px;
				color: #4b5563;
				line-height: 1.8;
				margin-bottom: 30px;
			}

			/* Button */
			.button-container {
				text-align: center;
				margin: 30px 0;
			}

			.button {
				display: inline-block;
				padding: 14px 32px;
				background: linear-gradient(135deg, #14b8a6 0%, #06b6d4 100%);
				color: #ffffff !important;
				text-decoration: none;
				border-radius: 6px;
				font-weight: 600;
				font-size: 15px;
				transition: transform 0.2s;
			}

			.button:hover {
				transform: translateY(-2px);
			}

			/* Info Box */
			.info-box {
				background-color: #f0fdfa;
				border-left: 4px solid #14b8a6;
				padding: 20px;
				margin: 25px 0;
				border-radius: 4px;
			}

			.info-box h3 {
				color: #0f766e;
				font-size: 16px;
				margin-bottom: 10px;
			}

			.info-box p {
				color: #115e59;
				margin: 5px 0;
				font-size: 14px;
			}

			/* Highlight */
			.highlight {
				background-color: #fef3c7;
				padding: 2px 6px;
				border-radius: 3px;
				color: #92400e;
				font-weight: 500;
			}

			/* Amount Display */
			.amount {
				font-size: 32px;
				font-weight: 700;
				color: #14b8a6;
				text-align: center;
				margin: 20px 0;
			}

			/* Footer */
			.email-footer {
				background-color: #f9fafb;
				padding: 30px 20px;
				text-align: center;
				border-top: 1px solid #e5e7eb;
			}

			.footer-text {
				color: #6b7280;
				font-size: 13px;
				margin: 10px 0;
			}

			.social-links {
				margin: 20px 0 10px;
			}

			.social-links a {
				display: inline-block;
				margin: 0 10px;
				color: #14b8a6;
				text-decoration: none;
				font-size: 13px;
			}

			/* Divider */
			.divider {
				height: 1px;
				background-color: #e5e7eb;
				margin: 30px 0;
			}

			/* Responsive */
			@media only screen and (max-width: 600px) {
				body {
					padding: 10px;
				}

				.email-content {
					padding: 30px 20px;
				}

				.email-header h1 {
					font-size: 24px;
				}

				.amount {
					font-size: 28px;
				}
			}

			/* Custom Styles Block */
		</style>
	</head>
	<body>
		<div class="email-container">
			<!-- Header -->
			<div class="email-header">
				<div class="logo">💰 Student Coin</div>
				<h1>Sistema de Moedas Estudantis</h1>
			</div>

			<!-- Content -->
			<div
				class="email-content"
				th:insert="~{::content}"
			>
				<!-- Conteúdo específico será inserido aqui -->
			</div>

			<!-- Footer -->
			<div class="email-footer">
				<p class="footer-text">
					<strong>Student Coin</strong> - Sistema de Moedas Estudantis
				</p>
				<p class="footer-text">
					Este é um email automático, por favor não responda.
				</p>
				<div class="social-links">
					<a href="http://localhost:3000">Acessar Plataforma</a> |
					<a href="http://localhost:3000/help">Ajuda</a> |
					<a href="http://localhost:3000/terms">Termos de Uso</a>
				</div>
				<p
					class="footer-text"
					style="margin-top: 20px; font-size: 12px"
				>
					© 2025 Student Coin. Todos os direitos reservados.
				</p>
			</div>
		</div>
	</body>
</html>
